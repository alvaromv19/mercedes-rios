<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Un momento…</title>
<style>
  :root{ --bg:#0b0b0c; --ivory:#f4f1ea; --verde:#1f9d55; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ivory);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .caja{max-width:340px}
  .punto{width:34px;height:34px;margin:0 auto 18px;border-radius:50%;
         border:3px solid rgba(244,241,234,.18);border-top-color:var(--verde);
         animation:giro .9s linear infinite}
  @keyframes giro{to{transform:rotate(360deg)}}
  p{margin:0;font-size:15px;line-height:1.5;opacity:.85}
  a{display:inline-block;margin-top:20px;color:var(--verde);font-weight:600;
    text-decoration:none;border-bottom:1px solid currentColor}
  @media (prefers-reduced-motion: reduce){ .punto{animation:none} }
</style>
</head>
<body>
  <div class="caja">
    <div class="punto" aria-hidden="true"></div>
    <p>Abriendo tu diagnóstico…</p>
    <noscript><p>Toca el botón para continuar.</p></noscript>
    <a id="manual" href="/puerta-de-acceso">Continuar</a>
  </div>

<script>
(function(){
  // Reparto 50/50 entre las dos versiones del diagnostico.
  // A = pagina con el video de Mercedes   B = diagnostico directo (v2)
  var DESTINOS = {
    A: '/puerta-de-acceso',
    B: '/diagnostico-v2.html'
  };
  var CLAVE = 'syk_arm_puerta';

  function leer(){
    try { var v = localStorage.getItem(CLAVE); return (v === 'A' || v === 'B') ? v : null; }
    catch(e){ return null; }
  }
  function guardar(v){
    try { localStorage.setItem(CLAVE, v); } catch(e){}
  }

  // Si ya le toco un lado antes, se respeta: la misma persona no debe
  // aparecer en las dos hojas si vuelve a tocar el boton.
  // Test cerrado el 9 de noviembre: todos van a la version con video (A),
  // incluso quien antes cayo en B.
  var lado = 'A';
  guardar(lado);

  // Se conservan los parametros que vengan del DM y se agrega la marca del lado.
  var params = new URLSearchParams(location.search);
  params.set('arm', lado === 'A' ? 'video' : 'directo');
  if (!params.get('utm_source')) params.set('utm_source', 'ig');

  var url = DESTINOS[lado] + '?' + params.toString();

  var manual = document.getElementById('manual');
  if (manual) manual.setAttribute('href', url);

  location.replace(url);
})();
</script>
</body>
</html>
